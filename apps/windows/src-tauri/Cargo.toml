[package]
name = "nexus-ai"
version = "1.0.0"
description = "NEXUS AI — Plataforma Multi-IA"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
