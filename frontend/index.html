<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JCK AI - Plataforma Multi-IA Universal para Windows y Android">
    <meta name="keywords" content="AI, multi-AI, autonomous agent, development platform, Windows, Android">
    <meta name="author" content="JCK AI Team">
    
    <title>JCK AI - Plataforma Multi-IA Universal</title>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Theme color -->
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  </head>
  <body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Loading state -->
    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-gray-50 dark:bg-gray-900 z-50 transition-opacity duration-300">
      <div class="text-center">
        <div class="relative">
          <div class="w-16 h-16 border-4 border-nexus-200 dark:border-s-800 border-t-nexus-600 dark:border-t-nexus-400 rounded-full animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-8 h-8 bg-nexus-600 dark:bg-nexus-400 rounded-full"></div>
          </div>
        </div>
        <p class="mt-4 text-lg font-semibold text-nexus-700 dark:text-nexus-300">JCK AI</p>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Iniciando plataforma multi-IA...</p>
      </div>
    </div>
    
    <script>
      // Hide loading screen when app is loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
          }, 300);
        }, 500);
      });
    </script>
  </body>
</html>
